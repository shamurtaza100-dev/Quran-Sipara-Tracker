<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quran Sipara Reading Tracker</title>
  <style>
    :root {
      --bg: #131314;
      --surface: #1e1f20;
      --surface-hover: #282a2c;
      --border: #333537;
      --text: #e3e3e3;
      --muted: #9aa0a6;
      --green: #34a853;
      --green-bg: rgba(52, 168, 83, 0.14);
      --amber: #fbbc04;
      --amber-bg: rgba(251, 188, 4, 0.15);
      --blue: #8ab4f8;
      --blue-solid: #3b82f6;
      --blue-bg: rgba(138, 180, 248, 0.14);
      --danger: #f28b82;
      --danger-solid: #dc2626;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); padding: 20px; }
    .container { max-width: 1020px; margin: 0 auto; }
    header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 22px; }
    .title-area h1 { margin: 0 0 6px; font-size: 1.65rem; font-weight: 700; display: flex; align-items: center; gap: 10px; color: #fff; }
    .title-area p { margin: 0; color: var(--muted); font-size: 0.92rem; }
    .header-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .sync-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 0.78rem; font-weight: 600; padding: 6px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); color: var(--muted); }
    .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
    .sync-pill.syncing .sync-dot { background: var(--amber); }
    .sync-pill.error .sync-dot { background: var(--danger); }
    .pill-btn { background: var(--surface); color: var(--text); border: 1px solid var(--border); padding: 9px 16px; border-radius: 999px; font-size: 0.88rem; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; transition: background 0.15s, border-color 0.15s; }
    .pill-btn:hover { background: var(--surface-hover); border-color: #4b4e52; }

    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
    @media (max-width: 720px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; }
    .stat-label { font-size: 0.82rem; color: var(--muted); font-weight: 600; margin-bottom: 6px; }
    .stat-value { font-size: 1.55rem; font-weight: 700; }
    .stat-green { color: var(--green); }
    .stat-amber { color: var(--amber); }
    .stat-blue { color: var(--blue); }

    .control-bar { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 18px; display: flex; flex-direction: column; gap: 14px; }
    .input-row { display: flex; flex-direction: column; gap: 6px; }
    .input-row label { font-size: 0.85rem; font-weight: 600; color: var(--text); }
    .input-row label span { color: var(--danger); }
    input[type="text"], input[type="password"] { background: var(--bg); color: #fff; border: 1.5px solid var(--border); border-radius: 10px; padding: 11px 14px; font-size: 0.95rem; width: 100%; outline: none; transition: border-color 0.15s; }
    input:focus { border-color: var(--blue); }
    input.input-error { border-color: var(--danger); background: rgba(242, 139, 130, 0.08); }

    .claim-full-btn { width: 100%; background: var(--blue-solid); color: #fff; border: none; border-radius: 10px; padding: 12px 18px; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: opacity 0.15s; }
    .claim-full-btn:hover { opacity: 0.92; }

    .status-banner { min-height: 22px; font-size: 0.9rem; font-weight: 500; margin-bottom: 14px; color: var(--green); }
    .status-banner.error { color: var(--danger); }

    .juz-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(185px, 1fr)); gap: 14px; margin-bottom: 24px; }
    .juz-card { background: var(--surface); border: 1.5px solid var(--border); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; justify-content: space-between; gap: 12px; transition: border-color 0.15s, transform 0.1s; }
    .juz-card.status-reading { border-color: rgba(251, 188, 4, 0.55); background: linear-gradient(180deg, rgba(251,188,4,0.06) 0%, var(--surface) 100%); }
    .juz-card.status-completed { border-color: rgba(138, 180, 248, 0.45); background: linear-gradient(180deg, rgba(138,180,248,0.06) 0%, var(--surface) 100%); opacity: 0.85; }

    .juz-top { display: flex; justify-content: space-between; align-items: center; }
    .juz-num { font-size: 0.95rem; font-weight: 700; color: #fff; }
    .status-tag { font-size: 0.72rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
    .tag-available { background: var(--green-bg); color: var(--green); }
    .tag-reading { background: var(--amber-bg); color: var(--amber); }
    .tag-completed { background: var(--blue-bg); color: var(--blue); }

    .juz-arabic { font-size: 1.35rem; font-weight: 700; text-align: right; color: #fff; direction: rtl; line-height: 1.5; }
    .juz-translit { font-size: 0.82rem; color: var(--muted); margin-top: -6px; }
    .juz-reader { font-size: 0.78rem; color: var(--text); background: rgba(255,255,255,0.04); padding: 6px 9px; border-radius: 8px; }

    .card-btn { width: 100%; border: none; border-radius: 8px; padding: 9px 12px; font-size: 0.84rem; font-weight: 600; cursor: pointer; transition: opacity 0.15s; }
    .card-btn:hover:not(:disabled) { opacity: 0.9; }
    .btn-claim { background: rgba(52, 168, 83, 0.2); color: var(--green); border: 1px solid rgba(52, 168, 83, 0.4); }
    .btn-finish { background: var(--amber); color: #131314; }
    .btn-locked { background: rgba(138, 180, 248, 0.12); color: var(--blue); cursor: not-allowed; }

    .admin-box { display: none; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-top: 20px; }
    .admin-box.active { display: block; }
    .admin-box h3 { margin: 0 0 12px; font-size: 1rem; color: #fff; }
    .admin-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .btn-verify { background: var(--blue-solid); color: #fff; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .btn-excel { background: var(--green); color: #fff; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .btn-reset { background: var(--danger-solid); color: #fff; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .btn-lock { background: var(--surface-hover); color: var(--text); border: 1px solid var(--border); padding: 10px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="title-area">
        <h1>📖 Quran Sipara Reading Tracker</h1>
        <p>Select a Juz to start reading, mark it complete when finished, and track collective Quran completions.</p>
      </div>
      <div class="header-actions">
        <span id="syncPill" class="sync-pill"><span class="sync-dot"></span><span id="syncText">Live Sync Ready</span></span>
        <button type="button" id="refreshBtn" class="pill-btn">↻ Sync Now</button>
        <button type="button" id="shareBtn" class="pill-btn">🔗 Share link</button>
        <button type="button" id="adminToggleBtn" class="pill-btn">🛡️ Admin view</button>
      </div>
    </header>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Available</div>
        <div id="statAvailable" class="stat-value stat-green">30 / 30</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Being Read</div>
        <div id="statReading" class="stat-value stat-amber">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Completed</div>
        <div id="statCompleted" class="stat-value stat-blue">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Full Quran Rounds</div>
        <div id="statRounds" class="stat-value stat-blue">★ 0</div>
      </div>
    </div>

    <div class="control-bar">
      <div class="input-row">
        <label for="readerName">Reader name validation <span>*</span></label>
        <input type="text" id="readerName" placeholder="Enter your full name (required before selecting any Juz or Full Quran)..." />
      </div>
      <button type="button" id="claimFullBtn" class="claim-full-btn">Claim entire 30 Siparas (Full Quran)</button>
    </div>

    <div id="statusMsg" class="status-banner"></div>

    <div id="juzGrid" class="juz-grid"></div>

    <div id="adminBox" class="admin-box">
      <h3>Unlock Admin Mode</h3>
      <div id="adminLoginRow" class="admin-row">
        <input type="password" id="adminPass" placeholder="Enter password" autocomplete="off" style="max-width: 260px;" />
        <button type="button" id="verifyBtn" class="btn-verify">Verify</button>
      </div>
      <div id="adminControlsRow" class="admin-row" style="display:none;">
        <span style="color: var(--green); font-weight: 600; margin-right: 6px;">Admin Unlocked:</span>
        <button type="button" id="excelBtn" class="btn-excel">Download Excel (.xls)</button>
        <button type="button" id="resetBtn" class="btn-reset">Reset Tracker</button>
        <button type="button" id="lockBtn" class="btn-lock">Lock</button>
      </div>
    </div>
  </div>

  <script>
    const GOOGLE_SHEET_API = "https://script.google.com/macros/s/AKfycbyiBsUIe4T1f281xkAoloKS-kkMQ3VOkJ3Su8pjAz6mq22lss_56_EKztdl9MG_djDmzw/exec";
    const ADMIN_KEY = "Qaz@1234";

    const JUZ_DATA = [
      { num: 1, ar: "الم", tr: "Alif Lam Meem" },
      { num: 2, ar: "سَيَقُولُ", tr: "Sayaqool" },
      { num: 3, ar: "تِلْكَ الرُّسُلُ", tr: "Tilkal Rusull" },
      { num: 4, ar: "لَنْ تَنَالُوا", tr: "Lan Tana Loo" },
      { num: 5, ar: "وَالْمُحْصَنَاتُ", tr: "Wal Mohsanat" },
      { num: 6, ar: "لَا يُحِبُّ اللَّهُ", tr: "La Yuhibbullah" },
      { num: 7, ar: "وَإِذَا سَمِعُوا", tr: "Wa Iza Samiu" },
      { num: 8, ar: "وَلَوْ أَنَّنَا", tr: "Wa Lau Annana" },
      { num: 9, ar: "قَالَ الْمَلَأُ", tr: "Qalal Malao" },
      { num: 10, ar: "وَاعْلَمُوا", tr: "Wa A'lamu" },
      { num: 11, ar: "يَعْتَذِرُونَ", tr: "Yatazeroon" },
      { num: 12, ar: "وَمَا مِنْ دَابَّةٍ", tr: "Wa Mamin Da'abat" },
      { num: 13, ar: "وَمَا أُبَرِّئُ", tr: "Wa Ma Ubrioo" },
      { num: 14, ar: "رُبَمَا", tr: "Rubama" },
      { num: 15, ar: "سُبْحَانَ الَّذِي", tr: "Subhanallazi" },
      { num: 16, ar: "قَالَ أَلَمْ", tr: "Qal Alam" },
      { num: 17, ar: "اقْتَرَبَ", tr: "Aqtarabo" },
      { num: 18, ar: "قَدْ أَفْلَحَ", tr: "Qadd Aflaha" },
      { num: 19, ar: "وَقَالَ الَّذِينَ", tr: "Wa Qalallazina" },
      { num: 20, ar: "أَمَّنْ خَلَقَ", tr: "A'man Khalaq" },
      { num: 21, ar: "اتْلُ مَا أُوحِيَ", tr: "Utlu Ma Oohi" },
      { num: 22, ar: "وَمَنْ يَقْنُتْ", tr: "Wa Manyaqnut" },
      { num: 23, ar: "وَمَا لِيَ", tr: "Wa Mali" },
      { num: 24, ar: "فَمَنْ أَظْلَمُ", tr: "Faman Azlam" },
      { num: 25, ar: "إِلَيْهِ يُرَدُّ", tr: "Elahe Yuruddo" },
      { num: 26, ar: "حم", tr: "Ha'a Meem" },
      { num: 27, ar: "قَالَ فَمَا خَطْبُكُمْ", tr: "Qala Fama Khatbukum" },
      { num: 28, ar: "قَدْ سَمِعَ اللَّهُ", tr: "Qadd Sami Allah" },
      { num: 29, ar: "تَبَارَكَ الَّذِي", tr: "Tabarakallazi" },
      { num: 30, ar: "عَمَّ يَتَسَاءَلُونَ", tr: "Amma Yatasa'aloon" }
    ];

    let state = {
      juzState: {},
      fullRounds: 0,
      logs: []
    };

    let adminUnlocked = false;
    let resetConfirmed = false;
    let isSyncing = false;

    try {
      const cached = JSON.parse(localStorage.getItem("quran_sipara_dark_v1") || "null");
      if (cached && typeof cached === "object") {
        state = {
          juzState: cached.juzState || {},
          fullRounds: cached.fullRounds || 0,
          logs: cached.logs || []
        };
      }
    } catch (e) {}

    function setSyncStatus(mode, text) {
      const pill = document.getElementById("syncPill");
      const label = document.getElementById("syncText");
      pill.className = "sync-pill" + (mode ? " " + mode : "");
      label.textContent = text;
    }

    async function loadFromSheet(silent = false) {
      if (isSyncing) return;
      isSyncing = true;
      setSyncStatus("syncing", "Syncing...");
      try {
        const res = await fetch(GOOGLE_SHEET_API + "?t=" + Date.now(), {
          method: "GET",
          redirect: "follow"
        });
        const data = await res.json();
        if (data && typeof data === "object") {
          state = {
            juzState: data.juzState || {},
            fullRounds: Number(data.fullRounds) || 0,
            logs: Array.isArray(data.logs) ? data.logs : []
          };
          localStorage.setItem("quran_sipara_dark_v1", JSON.stringify(state));
          render();
          setSyncStatus("", "Live Synced");
          if (!silent) showStatus("Synced latest data from Google Sheet.");
        }
      } catch (err) {
        setSyncStatus("error", "Offline / Retry");
        if (!silent) showStatus("Could not reach Google Sheet. Check internet or deployment access.", true);
      } finally {
        isSyncing = false;
      }
    }

    async function pushToSheet() {
      localStorage.setItem("quran_sipara_dark_v1", JSON.stringify(state));
      setSyncStatus("syncing", "Saving to Sheet...");
      try {
        await fetch(GOOGLE_SHEET_API, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(state)
        });
        setSyncStatus("", "Saved to Sheet");
      } catch (err) {
        setSyncStatus("error", "Save Failed");
        showStatus("Saved locally, but failed to sync to Google Sheet.", true);
      }
    }

    function showStatus(msg, isError = false) {
      const el = document.getElementById("statusMsg");
      el.textContent = msg;
      el.className = isError ? "status-banner error" : "status-banner";
    }

    function getValidReaderName() {
      const input = document.getElementById("readerName");
      const name = input.value.trim();
      if (!name) {
        input.classList.add("input-error");
        input.focus();
        showStatus("Reader name is compulsory before selecting, updating, or claiming any Sipara or Full Quran.", true);
        return null;
      }
      input.classList.remove("input-error");
      return name;
    }

    async function handleStartReading(juzNum) {
      const name = getValidReaderName();
      if (!name) return;

      const current = state.juzState[juzNum];
      if (current && current.status !== "available") return;

      state.juzState[juzNum] = { status: "reading", reader: name };
      state.logs.push({
        time: new Date().toLocaleString(),
        reader: name,
        item: "Juz " + juzNum,
        action: "Started Reading"
      });
      render();
      showStatus("Juz " + juzNum + " marked as Being Read by " + name + ".");
      await pushToSheet();
    }

    async function handleCompleteJuz(juzNum) {
      const name = getValidReaderName();
      if (!name) return;

      state.juzState[juzNum] = { status: "completed", reader: name };
      state.logs.push({
        time: new Date().toLocaleString(),
        reader: name,
        item: "Juz " + juzNum,
        action: "Completed"
      });

      const completedCount = JUZ_DATA.filter(j => state.juzState[j.num]?.status === "completed").length;
      if (completedCount === 30) {
        state.fullRounds += 1;
        state.logs.push({
          time: new Date().toLocaleString(),
          reader: name,
          item: "Full Quran (All 30 Juz)",
          action: "Round Completed (+1)"
        });
        state.juzState = {};
        render();
        showStatus("MashaAllah! All 30 Juz completed! Full Quran Rounds increased by 1 and all 30 Juz are unlocked for the next round.");
      } else {
        render();
        showStatus("Juz " + juzNum + " completed by " + name + "! (" + completedCount + "/30 completed in current round)");
      }
      await pushToSheet();
    }

    async function handleClaimFullQuran() {
      const name = getValidReaderName();
      if (!name) return;

      state.fullRounds += 1;
      state.logs.push({
        time: new Date().toLocaleString(),
        reader: name,
        item: "Full Quran (30 Siparas)",
        action: "Claimed Full Quran (+1)"
      });
      render();
      showStatus("MashaAllah! Full Quran completion recorded for " + name + ". Total Full Quran Rounds: " + state.fullRounds + ".");
      await pushToSheet();
    }

    function render() {
      let available = 0;
      let reading = 0;
      let completed = 0;

      JUZ_DATA.forEach(j => {
        const st = state.juzState[j.num]?.status || "available";
        if (st === "reading") reading++;
        else if (st === "completed") completed++;
        else available++;
      });

      document.getElementById("statAvailable").textContent = available + " / 30";
      document.getElementById("statReading").textContent = reading;
      document.getElementById("statCompleted").textContent = completed;
      document.getElementById("statRounds").textContent = "★ " + state.fullRounds;

      const grid = document.getElementById("juzGrid");
      grid.innerHTML = "";

      JUZ_DATA.forEach(j => {
        const entry = state.juzState[j.num] || { status: "available", reader: "" };
        const st = entry.status;

        const card = document.createElement("div");
        card.className = "juz-card" + (st === "reading" ? " status-reading" : st === "completed" ? " status-completed" : "");

        const top = document.createElement("div");
        top.className = "juz-top";

        const numEl = document.createElement("span");
        numEl.className = "juz-num";
        numEl.textContent = "Juz " + j.num;

        const tag = document.createElement("span");
        tag.className = "status-tag " + (st === "reading" ? "tag-reading" : st === "completed" ? "tag-completed" : "tag-available");
        tag.textContent = st === "reading" ? "Being Read" : st === "completed" ? "Completed" : "Available";

        top.appendChild(numEl);
        top.appendChild(tag);

        const arEl = document.createElement("div");
        arEl.className = "juz-arabic";
        arEl.textContent = j.ar;

        const trEl = document.createElement("div");
        trEl.className = "juz-translit";
        trEl.textContent = j.tr;

        card.appendChild(top);
        card.appendChild(arEl);
        card.appendChild(trEl);

        if (entry.reader) {
          const readerEl = document.createElement("div");
          readerEl.className = "juz-reader";
          readerEl.textContent = (st === "completed" ? "Completed by: " : "Reader: ") + entry.reader;
          card.appendChild(readerEl);
        }

        const btn = document.createElement("button");
        btn.type = "button";
        if (st === "available") {
          btn.className = "card-btn btn-claim";
          btn.textContent = "Start Reading";
          btn.addEventListener("click", () => handleStartReading(j.num));
        } else if (st === "reading") {
          btn.className = "card-btn btn-finish";
          btn.textContent = "Mark Complete";
          btn.addEventListener("click", () => handleCompleteJuz(j.num));
        } else {
          btn.className = "card-btn btn-locked";
          btn.textContent = "Locked (Round Complete)";
          btn.disabled = true;
        }

        card.appendChild(btn);
        grid.appendChild(card);
      });
    }

    function verifyAdmin() {
      const passInput = document.getElementById("adminPass");
      const val = passInput.value.trim();
      if (!val) {
        passInput.classList.add("input-error");
        passInput.focus();
        showStatus("Please enter the password before verifying.", true);
        return;
      }
      if (val === ADMIN_KEY) {
        adminUnlocked = true;
        passInput.value = "";
        passInput.classList.remove("input-error");
        document.getElementById("adminLoginRow").style.display = "none";
        document.getElementById("adminControlsRow").style.display = "flex";
        showStatus("Admin mode unlocked.");
      } else {
        passInput.classList.add("input-error");
        passInput.select();
        showStatus("Incorrect password.", true);
      }
    }

    function lockAdmin() {
      adminUnlocked = false;
      resetConfirmed = false;
      document.getElementById("resetBtn").textContent = "Reset Tracker";
      document.getElementById("adminControlsRow").style.display = "none";
      document.getElementById("adminLoginRow").style.display = "flex";
      showStatus("Admin mode locked.");
    }

    function exportExcel() {
      if (!adminUnlocked) {
        showStatus("Admin verification required to download Excel.", true);
        return;
      }
      let tableHtml = "<table border='1'><tr><th colspan='4'>Quran Sipara Reading Tracker Summary</th></tr>";
      tableHtml += "<tr><th>Full Quran Rounds Completed</th><td colspan='3'>" + state.fullRounds + "</td></tr>";
      tableHtml += "<tr><th>Juz</th><th>Arabic</th><th>Current Round Status</th><th>Reader</th></tr>";

      JUZ_DATA.forEach(j => {
        const entry = state.juzState[j.num] || { status: "Available", reader: "-" };
        tableHtml += "<tr><td>Juz " + j.num + " (" + j.tr + ")</td><td>" + j.ar + "</td><td>" + entry.status + "</td><td>" + (entry.reader || "-") + "</td></tr>";
      });

      tableHtml += "<tr><td colspan='4'></td></tr><tr><th colspan='4'>Activity Logs</th></tr>";
      tableHtml += "<tr><th>Timestamp</th><th>Reader Name</th><th>Sipara / Item</th><th>Action</th></tr>";
      state.logs.forEach(l => {
        tableHtml += "<tr><td>" + l.time + "</td><td>" + l.reader + "</td><td>" + l.item + "</td><td>" + l.action + "</td></tr>";
      });
      tableHtml += "</table>";

      const blob = new Blob(["﻿" + tableHtml], { type: "application/vnd.ms-excel;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "Quran_Sipara_Tracker.xls";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showStatus("Excel file downloaded.");
    }

    async function resetTracker() {
      if (!adminUnlocked) {
        showStatus("Admin verification required to reset tracker.", true);
        return;
      }
      const btn = document.getElementById("resetBtn");
      if (!resetConfirmed) {
        resetConfirmed = true;
        btn.textContent = "Confirm Reset?";
        showStatus("Click 'Confirm Reset?' again to erase all tracker data from this browser and Google Sheet.", true);
        return;
      }
      state = { juzState: {}, fullRounds: 0, logs: [] };
      resetConfirmed = false;
      btn.textContent = "Reset Tracker";
      localStorage.removeItem("quran_sipara_dark_v1");
      render();
      showStatus("Tracker reset to 0.");
      await pushToSheet();
    }

    function copyShareLink() {
      const shareUrl = window.location.origin + window.location.pathname;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(shareUrl).then(() => {
          showStatus("Live website link copied to clipboard!");
        }).catch(() => {
          prompt("Copy this live link:", shareUrl);
        });
      } else {
        prompt("Copy this live link:", shareUrl);
      }
    }

    document.getElementById("readerName").addEventListener("input", (e) => {
      if (e.target.value.trim()) e.target.classList.remove("input-error");
    });

    document.getElementById("claimFullBtn").addEventListener("click", handleClaimFullQuran);
    document.getElementById("refreshBtn").addEventListener("click", () => loadFromSheet(false));
    document.getElementById("shareBtn").addEventListener("click", copyShareLink);

    document.getElementById("adminToggleBtn").addEventListener("click", () => {
      const box = document.getElementById("adminBox");
      box.classList.toggle("active");
      if (box.classList.contains("active") && !adminUnlocked) {
        document.getElementById("adminPass").focus();
      }
    });

    document.getElementById("verifyBtn").addEventListener("click", verifyAdmin);
    document.getElementById("adminPass").addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        verifyAdmin();
      }
    });
    document.getElementById("adminPass").addEventListener("input", (e) => {
      e.target.classList.remove("input-error");
    });

    document.getElementById("excelBtn").addEventListener("click", exportExcel);
    document.getElementById("resetBtn").addEventListener("click", resetTracker);
    document.getElementById("lockBtn").addEventListener("click", lockAdmin);

    render();
    loadFromSheet(true);
    setInterval(() => loadFromSheet(true), 20000);
  </script>
</body>
</html>
